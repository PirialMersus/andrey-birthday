<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Андрею Веретенникову — С Днем Рождения!</title>
    <meta name="description" content="Интерактивное праздничное поздравление для Просветленного Мастера Андрея Веретенникова">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020205;
            font-family: 'Cormorant Garamond', Georgia, serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(1, 1, 3, 0.85) 95%);
            pointer-events: none;
            z-index: 2;
        }

        #ui-layout {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 24px;
            pointer-events: none;
        }

        .top-master-badge {
            align-self: center;
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(10, 8, 22, 0.82);
            border: 1px solid rgba(212, 175, 55, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 24px 10px 14px;
            border-radius: 60px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            pointer-events: auto;
            animation: fadeInDown 1.2s ease;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .badge-photo-frame {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 1.5px solid rgba(255, 215, 0, 0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            flex-shrink: 0;
        }

        .badge-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-text-box {
            text-align: left;
        }

        .badge-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 500;
            color: #ffd700;
            letter-spacing: 1.5px;
        }

        .badge-subtitle {
            font-size: 13px;
            color: #ddd6fe;
            font-style: italic;
        }

        .bottom-wishes-scroll {
            align-self: center;
            max-width: 560px;
            width: 100%;
            background: rgba(10, 8, 24, 0.88);
            border: 1px solid rgba(212, 175, 55, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 24px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 
                0 0 50px rgba(0, 0, 0, 0.8),
                0 0 80px rgba(212, 175, 55, 0.2);
            pointer-events: auto;
            animation: fadeInUp 1.2s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .scroll-wishes-text {
            font-size: 16.5px;
            font-weight: 300;
            font-style: italic;
            color: rgba(255, 255, 255, 0.95);
            line-height: 1.6;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }

        .scroll-footer-tag {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: rgba(212, 175, 55, 0.9);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            #ui-layout {
                padding: 16px;
            }

            .top-master-badge {
                padding: 8px 18px 8px 10px;
            }

            .badge-photo-frame {
                width: 40px;
                height: 40px;
            }

            .badge-title {
                font-size: 13px;
            }

            .badge-subtitle {
                font-size: 11px;
            }

            .bottom-wishes-scroll {
                padding: 18px 20px;
                border-radius: 20px;
            }

            .scroll-wishes-text {
                font-size: 14px;
                line-height: 1.5;
            }

            .scroll-footer-tag {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <div id="ui-layout">
        <div class="top-master-badge">
            <div class="badge-photo-frame">
                <img src="fas.jpg" alt="Мастер Андрей Веретенников">
            </div>
            <div class="badge-text-box">
                <div class="badge-title">Андрею Веретенникову</div>
                <div class="badge-subtitle">С Днем Рождения, Мастер! ✨</div>
            </div>
        </div>

        <div class="bottom-wishes-scroll">
            <p class="scroll-wishes-text">
                Желаем благодарных, целеустремленных учеников,<br>
                множества радостных людей вокруг и спасённых мурчащих хвостиков!<br>
                Спасибо за ваш свет, мудрость и доброе сердце! 🐾✨
            </p>
            <div class="scroll-footer-tag">✦ С глубокой благодарностью и уважением ✦</div>
        </div>
    </div>

    <canvas id="cosmic-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <script>
    (() => {
        const canvas = document.getElementById('cosmic-canvas');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);

        function setCamPos() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.position.set(0, 0.3, aspect < 1 ? 7.8 : 5.8);
        }
        setCamPos();

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x020205);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            setCamPos();
        });

        const purrAudio = new Audio('purr.mp3');
        purrAudio.loop = true;
        purrAudio.volume = 0.6;
        document.addEventListener('pointerdown', () => {
            if (purrAudio.paused) purrAudio.play().catch(() => {});
        }, { once: true });

        function createCircleTexture() {
            const c = document.createElement('canvas');
            c.width = 64;
            c.height = 64;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.3, 'rgba(255, 225, 150, 0.8)');
            grad.addColorStop(0.7, 'rgba(212, 175, 55, 0.3)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(c);
            tex.needsUpdate = true;
            return tex;
        }
        const circleTexture = createCircleTexture();

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffd700, 1.2);
        dirLight.position.set(4, 8, 4);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xa78bfa, 1.8, 12);
        pointLight.position.set(0, 1, 2);
        scene.add(pointLight);

        const STAR_COUNT = 2200;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(STAR_COUNT * 3);
        const starColors = new Float32Array(STAR_COUNT * 3);

        const goldColor = new THREE.Color(0xffd700);
        const violetColor = new THREE.Color(0xa78bfa);
        const whiteColor = new THREE.Color(0xffffff);

        for (let i = 0; i < STAR_COUNT; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 30;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 24;
            starPos[i * 3 + 2] = (Math.random() - 0.5) * 20;

            const rand = Math.random();
            const col = rand > 0.6 ? goldColor : (rand > 0.3 ? violetColor : whiteColor);
            starColors[i * 3] = col.r;
            starColors[i * 3 + 1] = col.g;
            starColors[i * 3 + 2] = col.b;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({
            size: 0.15,
            map: circleTexture,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starPoints = new THREE.Points(starGeo, starMat);
        scene.add(starPoints);

        let mainCatGroup = null;
        const gltfLoader = new THREE.GLTFLoader();

        gltfLoader.load('cat.gltf', (gltf) => {
            mainCatGroup = gltf.scene;
            mainCatGroup.position.set(0, -0.2, 0);
            mainCatGroup.rotation.set(0.12, -0.15, 0);
            mainCatGroup.scale.set(11.0, 11.0, 11.0);
            
            mainCatGroup.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.transparent = true;
                    child.material.opacity = 0.98;
                    child.material.roughness = 0.55;
                }
            });

            scene.add(mainCatGroup);
        });

        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            starPoints.rotation.y = elapsedTime * 0.012;
            starPoints.rotation.x = Math.sin(elapsedTime * 0.01) * 0.02;

            if (mainCatGroup) {
                mainCatGroup.position.y = -0.2 + Math.sin(elapsedTime * 0.8) * 0.015;
                mainCatGroup.rotation.y = -0.15 + Math.sin(elapsedTime * 0.4) * 0.04;
            }

            camera.position.x = Math.sin(elapsedTime * 0.08) * 0.18;
            camera.position.y = 0.3 + Math.cos(elapsedTime * 0.06) * 0.08;
            camera.lookAt(0, -0.1, 0);

            renderer.render(scene, camera);
        }

        animate();
    })();
    </script>
</body>
</html>
